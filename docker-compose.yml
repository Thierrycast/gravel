name: gravel
services:
  gravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: gravel:0.1.0
    container_name: gravel
    init: true
    restart: unless-stopped
    # Guardrail: bounds page cache and protects the host if something leaks.
    mem_limit: 320m
    ports:
      - "8421:3000"
      - "8422:3001"
    volumes:
      - gravel_data:/app/data
    # ⚠️ NENHUM SEGREDO LITERAL NESTE ARQUIVO. Ele é versionado num repositório
    # público — todo valor sensível entra por interpolação a partir do `.env`
    # (que é ignorado pelo git). Copie `.env.example` para `.env` e preencha.
    # O compose implantado no CasaOS
    # (/var/lib/casaos/apps/gravel/docker-compose.yml) é outro arquivo, fora do
    # git, e é lá que os valores reais ficam.
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=America/Sao_Paulo
      # Cap V8 heap so idle RSS doesn't ratchet up to the largest historical peak.
      - NODE_OPTIONS=--max-old-space-size=192
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID:?defina no .env}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET:?defina no .env}
      - PLUGGY_API_BASE=https://api.pluggy.ai
      - PLUGGY_API_KEY_HEADER=X-API-KEY
      - PLUGGY_AUTH_PATH=/auth
      - PLUGGY_CONNECT_TOKEN_PATH=/connect_token
      - PLUGGY_API_KEY_TTL_SECONDS=7200
      # Webhook da Pluggy: é por aqui que o dado chega em segundos, em vez de
      # esperar o sync periódico. A URL é a sub-rota do Tailscale Funnel, que o
      # Traefik reescreve para /api/webhooks/pluggy (só POST é exposto).
      # O secret vai no header X-Webhook-Secret, configurado no registro do
      # webhook via API (`pnpm gravel sync webhook --register`).
      # Trocar o secret exige reregistrar: `... --register --force`.
      - PLUGGY_WEBHOOK_URL=${PLUGGY_WEBHOOK_URL:-}
      - PLUGGY_WEBHOOK_SECRET=${PLUGGY_WEBHOOK_SECRET:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_BASE=https://api.binance.com
      - BINANCE_RECV_WINDOW=5000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina no .env}
      - LOGO_DEV_PUBLISHABLE_KEY=${LOGO_DEV_PUBLISHABLE_KEY:-}
      - LOGO_DEV_SECRET_KEY=${LOGO_DEV_SECRET_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_us: Web UI Port
      volumes:
        - container: /app/data
          description:
            en_us: Application Data

volumes:
  gravel_data:
    driver: local

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: gravel
  author: Thierrycast
  category: Finance
  description:
    en_us: Personal financial dashboard with multi-currency support and privacy mode. Tracking every digital 'cascalho' with precision.
    pt_br: Dashboard financeiro pessoal com suporte a múltiplas moedas e modo privado.
  developer: Thierrycast
  icon: https://raw.githubusercontent.com/Thierrycast/gravel/main/public/icon.png
  tagline:
    en_us: Financial tracking with precision.
    pt_br: Rastreamento financeiro com precisão.
  thumbnail: https://raw.githubusercontent.com/Thierrycast/gravel/main/public/icon.png
  title:
    en_us: Gravel
    pt_br: Gravel
  index: /
  port_map: "8421"
