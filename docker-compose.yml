name: gravel
services:
  gravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: gravel:0.1.0
    container_name: gravel
    init: true
    restart: unless-stopped
    mem_limit: 320m
    ports:
    - 127.0.0.1:8421:3000
    - <host-do-lab>:8421:3000
    - 127.0.0.1:8422:3001
    volumes:
    - <appdata>/gravel/data:/app/data
    env_file:
    - /home/thierry/.config/gravel/secrets.env
    environment:
    - DATABASE_URL=file:/app/data/prod.db
    - NODE_ENV=production
    - PORT=3000
    - HOSTNAME=0.0.0.0
    - TZ=America/Sao_Paulo
    - NODE_OPTIONS=--max-old-space-size=192
    - APP_SECRETS_ENCRYPTION_KEY=
    - PLUGGY_API_BASE=https://api.pluggy.ai
    - PLUGGY_API_KEY_HEADER=X-API-KEY
    - PLUGGY_AUTH_PATH=/auth
    - PLUGGY_CONNECT_TOKEN_PATH=/connect_token
    - PLUGGY_API_KEY_TTL_SECONDS=7200
    - PLUGGY_WEBHOOK_URL=https://<host-publico>/hooks/pluggy
    - BINANCE_API_BASE=https://api.binance.com
    - BINANCE_RECV_WINDOW=5000
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:3000/api/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    x-casaos:
      ports:
      - container: '3000'
        description:
          en_us: Web UI Port
      volumes:
      - container: /app/data
        description:
          en_us: Application Data
    networks:
      default: null
      omniroute_default: null
x-casaos:
  architectures:
  - amd64
  - arm64
  - arm
  main: gravel
  hostname: <host-publico>
  author: Thierrycast
  category: Productivity
  description:
    en_us: Personal financial dashboard with multi-currency support and privacy mode. Tracking every digital 'cascalho' with precision.
    pt_br: Dashboard financeiro pessoal com suporte a múltiplas moedas e modo privado.
  developer: Thierrycast
  icon: data:image/png;base64,
  tagline:
    en_us: Financial tracking with precision.
    pt_br: Rastreamento financeiro com precisão.
  thumbnail: data:image/png;base64,
  title:
    en_us: Gravel
    pt_br: Gravel
  index: /
  port_map: '8421'
  scheme: http
networks:
  omniroute_default:
    external: true
