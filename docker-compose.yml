name: gravel
services:
  gravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: gravel:0.1.0
    container_name: gravel
    init: true
    restart: unless-stopped
    # Guardrail: bounds page cache and protects the host if something leaks.
    mem_limit: 320m
    ports:
      - "8421:3000"
      - "8422:3001"
    volumes:
      - gravel_data:/app/data
    # Todo segredo vem deste arquivo, que vive FORA do repositório. Por isso
    # este compose pode ser versionado num repo público como está: não há valor
    # sensível, nem placeholder, nem interpolação a preencher.
    #
    # Crie-o a partir de `.env.example`:
    #   mkdir -p ~/.config/gravel && chmod 700 ~/.config/gravel
    #   $EDITOR ~/.config/gravel/secrets.env && chmod 600 ~/.config/gravel/secrets.env
    #
    # O destino é que só duas variáveis auto-geradas fiquem aqui
    # (APP_SECRETS_ENCRYPTION_KEY e INTERNAL_API_KEY) e as credenciais de
    # terceiros vivam criptografadas no banco, geridas em /settings → Segurança.
    env_file:
      - ${GRAVEL_SECRETS_FILE:-~/.config/gravel/secrets.env}

    # Só valores públicos abaixo — nada aqui é segredo.
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=America/Sao_Paulo
      # Cap V8 heap so idle RSS doesn't ratchet up to the largest historical peak.
      - NODE_OPTIONS=--max-old-space-size=192
      - PLUGGY_API_BASE=https://api.pluggy.ai
      - PLUGGY_API_KEY_HEADER=X-API-KEY
      - PLUGGY_AUTH_PATH=/auth
      - PLUGGY_CONNECT_TOKEN_PATH=/connect_token
      - PLUGGY_API_KEY_TTL_SECONDS=7200
      - BINANCE_API_BASE=https://api.binance.com
      - BINANCE_RECV_WINDOW=5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_us: Web UI Port
      volumes:
        - container: /app/data
          description:
            en_us: Application Data

volumes:
  gravel_data:
    driver: local

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: gravel
  author: Thierrycast
  category: Finance
  description:
    en_us: Personal financial dashboard with multi-currency support and privacy mode. Tracking every digital 'cascalho' with precision.
    pt_br: Dashboard financeiro pessoal com suporte a múltiplas moedas e modo privado.
  developer: Thierrycast
  icon: https://raw.githubusercontent.com/Thierrycast/gravel/main/public/icon.png
  tagline:
    en_us: Financial tracking with precision.
    pt_br: Rastreamento financeiro com precisão.
  thumbnail: https://raw.githubusercontent.com/Thierrycast/gravel/main/public/icon.png
  title:
    en_us: Gravel
    pt_br: Gravel
  index: /
  port_map: "8421"
